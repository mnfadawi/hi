  <path d="M19 18 C32 18 40 23.5 40 31.5 C40 39.5 32 45 19 45 Z" fill="url(#og)"/>

  <!-- E — bold filled white -->
  <rect x="48" y="18" width="7" height="52" rx="2" fill="rgba(255,255,255,0.88)"/>
  <rect x="48" y="18" width="26" height="7" rx="2" fill="rgba(255,255,255,0.88)"/>
  <rect x="48" y="39.5" width="20" height="6" rx="2" fill="rgba(255,255,255,0.88)"/>
  <rect x="48" y="63" width="26" height="7" rx="2" fill="rgba(255,255,255,0.88)"/>

  <!-- Orange swoosh underline -->
  <path d="M12 74 Q45 80 78 72" stroke="#F26522" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- 4-point sparkle top-right -->
