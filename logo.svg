<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90" width="90" height="90">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f0804"/>
      <stop offset="1" stop-color="#040404"/>
    </linearGradient>
    <!-- iPhone orange body -->
    <linearGradient id="iph" x1="0" y1="0" x2=".25" y2="1">
      <stop offset="0"   stop-color="#ff8840"/>
      <stop offset="48%" stop-color="#F26522"/>
      <stop offset="100%" stop-color="#9a2e0e"/>
    </linearGradient>
    <!-- Camera island -->
    <linearGradient id="isl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c04014"/>
      <stop offset="1" stop-color="#6a1e08"/>
    </linearGradient>
    <!-- Samsung white body -->
    <linearGradient id="sam" x1="0" y1="0" x2=".2" y2="1">
      <stop offset="0"   stop-color="#f6f9fc"/>
      <stop offset="100%" stop-color="#ccd6e0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="90" height="90" rx="20" fill="url(#bg)"/>

  <!-- ══════════════════════════════════════
       LEFT: iPhone 17 Pro Max · BACK · Orange
       Tilted -10° leaning toward center
  ══════════════════════════════════════ -->
  <g transform="rotate(-10 22 45)">
    <!-- Titanium frame (slightly thicker, darker) -->
    <rect x="7.5" y="15.5" width="29" height="59" rx="8" fill="#b83c10"/>
    <!-- Orange body -->
    <rect x="9"   y="17"   width="26" height="56" rx="6.5" fill="url(#iph)"/>
    <!-- Left edge specular highlight -->
    <rect x="9" y="26" width="1.3" height="28" rx=".65" fill="rgba(255,195,120,.26)"/>

    <!-- Camera Island — large rectangular block, top-left of back -->
    <rect x="11" y="20" width="18" height="18" rx="5" fill="url(#isl)"/>
    <rect x="11" y="20" width="18" height="18" rx="5" fill="none"
          stroke="rgba(60,10,0,.35)" stroke-width=".6"/>

    <!-- Lens 1 — main (top-left of island) -->
    <circle cx="16.5" cy="25" r="4.2" fill="#090909"/>
    <circle cx="16.5" cy="25" r="3.2" fill="#161616"/>
    <circle cx="16.5" cy="25" r="1.8" fill="#212121"/>
    <circle cx="17.4" cy="24.1" r=".65" fill="rgba(255,255,255,.19)"/>

    <!-- Lens 2 — telephoto (top-right of island) -->
    <circle cx="24.5" cy="25" r="3.7" fill="#090909"/>
    <circle cx="24.5" cy="25" r="2.8" fill="#161616"/>
    <circle cx="24.5" cy="25" r="1.6" fill="#212121"/>
    <circle cx="25.3" cy="24.2" r=".55" fill="rgba(255,255,255,.15)"/>

    <!-- Lens 3 — ultra-wide (bottom-left of island) -->
    <circle cx="16.5" cy="33" r="3.7" fill="#090909"/>
    <circle cx="16.5" cy="33" r="2.8" fill="#161616"/>
    <circle cx="16.5" cy="33" r="1.6" fill="#212121"/>
    <circle cx="17.3" cy="32.2" r=".55" fill="rgba(255,255,255,.15)"/>

    <!-- Flash / LiDAR sensor (bottom-right) -->
    <circle cx="24.5" cy="33" r="2.4" fill="#1a0e04"/>
    <circle cx="24.5" cy="33" r="1.2" fill="#f08022" opacity=".52"/>
    <circle cx="24.5" cy="33" r=".55" fill="#ffd080" opacity=".5"/>

    <!-- Apple logo embossed (center-lower of back) -->
    <circle cx="22" cy="54" r="4.5" fill="rgba(0,0,0,.12)"/>
    <circle cx="22" cy="54" r="3.2" fill="rgba(0,0,0,.06)"/>
  </g>

  <!-- ══════════════════════════════════════
       RIGHT: Samsung S26 · FRONT · White
       Tilted +10° leaning toward center
  ══════════════════════════════════════ -->
  <g transform="rotate(10 68 45)">
    <!-- Silver frame -->
    <rect x="53.5" y="15.5" width="29" height="59" rx="8" fill="#a8b8c6"/>
    <!-- White body -->
    <rect x="55"   y="17"   width="26" height="56" rx="6.5" fill="url(#sam)"/>
    <!-- Right edge subtle shadow -->
    <rect x="79.7" y="26" width="1.3" height="28" rx=".65" fill="rgba(0,0,0,.07)"/>

    <!-- Screen — thin bezels (Samsung style) -->
    <rect x="57.5" y="21.5" width="21" height="46" rx="4.5" fill="#040404"/>
    <!-- Screen faint warm tint -->
    <rect x="57.5" y="21.5" width="21" height="46" rx="4.5" fill="rgba(242,101,34,.03)"/>

    <!-- Punch-hole front camera (top-center of screen) -->
    <circle cx="68" cy="26" r="2.6" fill="#111"/>
    <circle cx="68" cy="26" r="1.4" fill="#1c1c1c"/>

    <!-- Home indicator bar (bottom of screen) -->
    <rect x="62" y="64.5" width="12" height="1.5" rx=".75"
          fill="#2a2a2a" opacity=".4"/>
  </g>

  <!-- ══════════════════════════════════════
       CENTER: Electric Bolt (between phones)
  ══════════════════════════════════════ -->
  <!-- Outer halo glow -->
  <circle cx="45" cy="45" r="11.5" fill="rgba(242,101,34,.14)"/>
  <!-- Mid glow -->
  <circle cx="45" cy="45" r="7.5"  fill="rgba(255,215,60,.18)"/>
  <!-- Inner bright core -->
  <circle cx="45" cy="45" r="4"    fill="rgba(255,248,140,.24)"/>

  <!-- Lightning bolt (filled) -->
  <path d="M48 36 L42 47 L46.5 47 L43 57" fill="#ffe566" opacity=".96"/>
  <!-- Bolt edge glow -->
  <path d="M48 36 L42 47 L46.5 47 L43 57"
        stroke="rgba(255,235,80,.5)" stroke-width="1.8"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Spark particles -->
  <circle cx="51"  cy="39" r="1.1" fill="#ffe566" opacity=".65"/>
  <circle cx="39.5" cy="53" r=".9" fill="#ffe566" opacity=".55"/>
  <circle cx="51"  cy="52" r=".8" fill="#ffe566" opacity=".5"/>
</svg>
