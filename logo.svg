<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 110" width="260" height="110">
  <!-- Dark background -->
  <rect width="260" height="110" fill="#0d0d0d" rx="8"/>

  <!-- P mark shape definition -->
  <defs>
    <clipPath id="p-logo">
      <!-- Vertical stem -->
      <rect x="10" y="10" width="17" height="90" rx="1"/>
      <!-- Bowl of P - angular/geometric -->
      <polygon points="27,10 55,10 74,24 74,44 55,58 27,58"/>
    </clipPath>
  </defs>

  <!-- Orange fill for P mark -->
  <rect x="0" y="0" width="90" height="110" fill="#F26522" clip-path="url(#p-logo)"/>

  <!-- White horizontal speed lines through P mark -->
  <g clip-path="url(#p-logo)" fill="white">
    <rect x="0" y="23" width="90" height="6"/>
    <rect x="0" y="35" width="90" height="6"/>
    <rect x="0" y="62" width="90" height="6"/>
    <rect x="0" y="74" width="90" height="6"/>
    <rect x="0" y="86" width="90" height="6"/>
  </g>

  <!-- PHONE text -->
  <text x="92" y="52" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="31" fill="white" letter-spacing="3">PHONE</text>
  <!-- ELECTRIK text -->
  <text x="92" y="84" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="31" fill="white" letter-spacing="2">ELECTRIK</text>
  <!-- Tagline -->
  <text x="92" y="99" font-family="Arial, sans-serif" font-weight="400" font-size="7.5" fill="#888888" letter-spacing="0.8">CELL PHONE + TABLET REPAIR AND ACCESSORIES</text>
</svg>
