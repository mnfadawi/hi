<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90" width="90" height="90">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#1e1a0e"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="10%" y2="100%">
      <stop offset="0%"   stop-color="#ffe082"/>
      <stop offset="55%"  stop-color="#F26522"/>
      <stop offset="100%" stop-color="#bf4100"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="90" height="90" rx="20" fill="url(#bg)"/>

  <!-- Soft glow halo -->
  <ellipse cx="46" cy="46" rx="26" ry="30" fill="#F26522" opacity="0.1"/>

  <!-- Lightning bolt — centered, clean, derived from classic icon proportions -->
  <path d="M48 19 L38 46 L48 46 L32 70 L58 40 L48 40 Z" fill="url(#bolt)"/>

  <!-- Sparkle accent top-right -->
  <g transform="translate(72,14)" fill="#ffe082" opacity="0.85">
    <path d="M0,-3.2 L0.7,-0.7 L3.2,0 L0.7,0.7 L0,3.2 L-0.7,0.7 L-3.2,0 L-0.7,-0.7 Z"/>
  </g>

  <!-- Three small dots — lower left accent -->
  <circle cx="14" cy="74" r="2"   fill="#F26522" opacity="0.45"/>
  <circle cx="20" cy="74" r="1.4" fill="#F26522" opacity="0.28"/>
  <circle cx="25" cy="74" r="0.9" fill="#F26522" opacity="0.16"/>
</svg>
