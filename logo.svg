<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 120" width="310" height="120">
  <!-- No background — transparent so it blends into the dark header -->

  <!-- P mark clipping shape -->
  <defs>
    <clipPath id="p-logo">
      <rect x="10" y="8" width="16" height="104" rx="1"/>
      <polygon points="26,8 68,8 88,26 88,58 68,74 26,74"/>
    </clipPath>
  </defs>

  <!-- Orange fill for P mark -->
  <rect x="0" y="0" width="96" height="120" fill="#F26522" clip-path="url(#p-logo)"/>

  <!-- White speed lines through the P mark -->
  <g clip-path="url(#p-logo)" fill="white" opacity="0.9">
    <rect x="0" y="24" width="96" height="7"/>
    <rect x="0" y="38" width="96" height="7"/>
    <rect x="0" y="76" width="96" height="7"/>
    <rect x="0" y="90" width="96" height="7"/>
  </g>

  <!-- PHONE text -->
  <text x="104" y="58" font-family="Arial Black, 'Arial Bold', Arial, sans-serif" font-weight="900" font-size="36" fill="white" letter-spacing="1">PHONE</text>
  <!-- ELECTRIK text -->
  <text x="104" y="94" font-family="Arial Black, 'Arial Bold', Arial, sans-serif" font-weight="900" font-size="36" fill="white" letter-spacing="1">ELECTRIK</text>
  <!-- Tagline -->
  <text x="104" y="112" font-family="Arial, sans-serif" font-weight="500" font-size="8" fill="rgba(255,255,255,0.6)" letter-spacing="0.5">CELL PHONE + TABLET REPAIR AND ACCESSORIES</text>
</svg>
