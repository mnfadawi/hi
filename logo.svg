<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 100" width="220" height="100">
  <!-- Black background -->
  <rect width="220" height="100" fill="#111111" rx="6"/>

  <!-- P mark -->
  <defs>
    <clipPath id="p-logo">
      <rect x="12" y="10" width="18" height="80" rx="2"/>
      <path d="M30 10 L58 10 Q78 10 78 28 Q78 46 58 46 L30 46 Z"/>
    </clipPath>
  </defs>
  <rect x="0" y="0" width="220" height="100" fill="#F26522" clip-path="url(#p-logo)"/>
  <g clip-path="url(#p-logo)" fill="white">
    <rect x="10" y="22" width="80" height="7"/>
    <rect x="10" y="35" width="80" height="7"/>
    <rect x="10" y="55" width="80" height="7"/>
    <rect x="10" y="68" width="80" height="7"/>
    <rect x="10" y="81" width="80" height="7"/>
  </g>

  <!-- PHONE text -->
  <text x="90" y="44" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="28" fill="white" letter-spacing="2">PHONE</text>
  <!-- ELECTRIK text -->
  <text x="90" y="74" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="28" fill="white" letter-spacing="2">ELECTRIK</text>
  <!-- Tagline -->
  <text x="90" y="88" font-family="Arial, sans-serif" font-weight="400" font-size="8" fill="#aaaaaa" letter-spacing="1">CELL PHONE + TABLET REPAIR AND ACCESSORIES</text>
</svg>
