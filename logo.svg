<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90" width="90" height="90">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#1a1208"/>
      <stop offset="1" stop-color="#060606"/>
    </linearGradient>
    <linearGradient id="crack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffe566"/>
      <stop offset="45%"  stop-color="#F26522"/>
      <stop offset="100%" stop-color="#a83800"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="90" height="90" rx="20" fill="url(#bg)"/>

  <!-- Phone body outline — thin, elegant white -->
  <rect x="23" y="10" width="44" height="70" rx="9"
        fill="none" stroke="rgba(255,255,255,.72)" stroke-width="1.8"/>

  <!-- Speaker slot -->
  <rect x="33" y="15" width="24" height="2.5" rx="1.25"
        fill="rgba(255,255,255,.42)"/>

  <!-- Home bar -->
  <rect x="36" y="74" width="18" height="2.5" rx="1.25"
        fill="rgba(255,255,255,.38)"/>

  <!-- Screen area — very faint warm tint -->
  <rect x="28" y="21" width="34" height="50" rx="2"
        fill="rgba(242,101,34,.06)"/>

  <!-- Crack glow — outermost soft halo -->
  <path d="M54 23 L42 47 L50 47 L36 71"
        stroke="rgba(242,101,34,.18)" stroke-width="10"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Crack glow — inner tighter glow -->
  <path d="M54 23 L42 47 L50 47 L36 71"
        stroke="rgba(255,210,80,.32)" stroke-width="4.5"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Main crack — Z-lightning bolt, gradient stroke -->
  <path d="M54 23 L42 47 L50 47 L36 71"
        stroke="url(#crack)" stroke-width="2.2"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Hairline cracks radiating from impact point (54,23) -->
  <path d="M54 23 L63 18 M54 23 L50 16 M50 47 L59 50 M36 71 L28 74"
        stroke="rgba(255,200,80,.42)" stroke-width=".85"
        fill="none" stroke-linecap="round"/>

  <!-- Spark / starburst at impact point -->
  <g transform="translate(54,23)">
    <path d="M0,-4.2 L.9,-.9 L4.2,0 L.9,.9 L0,4.2 L-.9,.9 L-4.2,0 L-.9,-.9 Z"
          fill="#ffe566" opacity=".92" transform="scale(.72)"/>
  </g>
</svg>
