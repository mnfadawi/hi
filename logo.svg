<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c1c"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe0c0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="80" height="80" rx="16" fill="url(#bg)"/>
  <!-- Orange bottom accent bar -->
  <rect x="12" y="73" width="56" height="4.5" rx="2.25" fill="#F26522"/>
  <!-- Phone body (orange) -->
  <rect x="15" y="6" width="50" height="64" rx="11" fill="#F26522"/>
  <!-- Screen cutout (dark) -->
  <rect x="21" y="15" width="38" height="44" rx="5" fill="#111111"/>
  <!-- Speaker notch -->
  <rect x="27" y="10" width="26" height="3.5" rx="1.75" fill="#111111" opacity="0.55"/>
  <!-- Home bar -->
  <rect x="30" y="65" width="20" height="2.5" rx="1.25" fill="#111111" opacity="0.45"/>
  <!-- Lightning bolt (white, centered on screen) -->
  <path d="M44 17 L28 43 L38 43 L34 61 L52 37 L42 37 Z" fill="url(#bolt)"/>
</svg>
