<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90" width="90" height="90">
  <defs>
    <radialGradient id="bgGrad" cx="38%" cy="36%" r="72%">
      <stop offset="0" stop-color="#1e1208"/>
      <stop offset="1" stop-color="#090909"/>
    </radialGradient>
    <linearGradient id="sparks" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#F26522"/>
    </linearGradient>
  </defs>

  <!-- Background — warm dark, slightly brown so it feels softer -->
  <rect width="90" height="90" rx="20" fill="url(#bgGrad)"/>

  <!-- Outer decorative ring — thin, elegant, orange -->
  <circle cx="45" cy="45" r="36" fill="none" stroke="#F26522" stroke-width="1.1" opacity="0.38"/>
  <!-- Inner ring — even thinner, creates depth -->
  <circle cx="45" cy="45" r="32.5" fill="none" stroke="#F26522" stroke-width="0.5" opacity="0.18"/>

  <!-- ── P monogram (orange, thin elegant strokes) ── -->
  <g stroke="url(#sparks)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vertical stem -->
    <line x1="28" y1="27" x2="28" y2="63"/>
    <!-- Elegant loop: arc from top of stem, curving right and back -->
    <path d="M28 27 C28 27 40 27 40 36 C40 45 28 45 28 45"/>
  </g>

  <!-- Thin divider dot between P and E -->
  <circle cx="46" cy="45" r="1.4" fill="#F26522" opacity="0.55"/>

  <!-- ── E monogram (white, thin elegant strokes) ── -->
  <g stroke="rgba(255,255,255,0.82)" stroke-width="2.4" fill="none" stroke-linecap="round">
    <!-- Vertical stem -->
    <line x1="51" y1="27" x2="51" y2="63"/>
    <!-- Top horizontal -->
    <line x1="51" y1="27" x2="64" y2="27"/>
    <!-- Middle horizontal (slightly shorter — classic E proportion) -->
    <line x1="51" y1="45" x2="62" y2="45"/>
    <!-- Bottom horizontal -->
    <line x1="51" y1="63" x2="64" y2="63"/>
  </g>

  <!-- ── Sparkle star — top right, feminine accent ── -->
  <g transform="translate(74,16)" fill="url(#sparks)" opacity="0.9">
    <path d="M0,-4.2 L0.9,-0.9 L4.2,0 L0.9,0.9 L0,4.2 L-0.9,0.9 L-4.2,0 L-0.9,-0.9 Z" transform="scale(0.78)"/>
  </g>

  <!-- ── Three small dot trail — lower left, delicate accent ── -->
  <circle cx="17" cy="71" r="2"   fill="#F26522" opacity="0.55"/>
  <circle cx="22" cy="71" r="1.4" fill="#F26522" opacity="0.35"/>
  <circle cx="26" cy="71" r="0.9" fill="#F26522" opacity="0.2"/>
</svg>
