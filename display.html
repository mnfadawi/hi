<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phone ElectriK — Store Poster</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #222;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Arial Black', Arial, sans-serif;
    }

    .poster {
      width:  min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ══════════════════════
       PINK TOP  —  68%
       Logo top-left, tagline, phones fill it
    ══════════════════════ */
    .pink {
      flex: 0 0 68%;
      position: relative;
      /* same pink/salmon as old sign */
      background: #F2A8C0;
      overflow: hidden;
    }

    /* subtle chevron pattern like old sign */
    .pink::after {
      content: '';
      position: absolute; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='40' height='24' viewBox='0 0 40 24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 12 L10 0 L20 12 L30 0 L40 12' stroke='rgba(180,70,100,0.13)' stroke-width='2' fill='none'/%3E%3Cpath d='M0 24 L10 12 L20 24 L30 12 L40 24' stroke='rgba(180,70,100,0.13)' stroke-width='2' fill='none'/%3E%3C/svg%3E");
      z-index: 0;
      pointer-events: none;
    }

    /* LOGO — top left, on pink, no dark bar */
    .logo-area {
      position: absolute;
      top: 3%; left: 4%;
      z-index: 3;
      display: flex; align-items: center; gap: 5%;
    }
    .logo-area img {
      height: clamp(44px, 9%, 80px);
      width: auto;
      /* make logo match old sign's pink/magenta tone */
      filter: brightness(0) saturate(100%)
              invert(28%) sepia(60%) saturate(600%)
              hue-rotate(295deg) brightness(85%) contrast(110%);
    }
    .logo-name {
      display: flex; flex-direction: column; line-height: 1;
    }
    .ln-phone {
      font-size: clamp(.4rem, 1.8vw, .7rem);
      letter-spacing: .28em; font-weight: 700;
      color: rgba(120,20,55,.55); text-transform: uppercase;
    }
    .ln-electrik {
      font-size: clamp(1.1rem, 5.2vw, 2.4rem);
      font-weight: 900; text-transform: uppercase;
      color: #B02858; letter-spacing: .05em; white-space: nowrap;
    }

    /* TAGLINE — dark text on pink like old sign */
    .tag {
      position: absolute;
      top: 17%; left: 0; right: 0;
      z-index: 3;
      text-align: center;
      font-family: Arial, sans-serif; font-weight: 800;
      font-size: clamp(.44rem, 2vw, .82rem);
      letter-spacing: .16em; text-transform: uppercase;
      color: #1a0810;
    }

    /* PHONES — fill the lower 78% of pink section */
    .phones {
      position: absolute;
      top: 24%; left: 0; right: 0; bottom: 0;
      z-index: 2;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .phone-col {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .phone-col img {
      width: 92%;
      max-height: 100%;
      object-fit: contain;
      object-position: bottom center;
      display: block;
    }
    .phone-col.left img {
      filter: drop-shadow(2px 8px 18px rgba(0,0,0,.35));
    }
    .phone-col.right img {
      filter: drop-shadow(-2px 8px 18px rgba(0,0,0,.3));
    }

    /* ══════════════════════
       WHITE BAND  —  14%
       BUY SELL REPAIR huge
    ══════════════════════ */
    .white-band {
      flex: 0 0 14%;
      background: #ffffff;
      border-top: 4px solid #222;
      border-bottom: 4px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      padding: 0 5%;
    }
    .bsr {
      font-size: clamp(1.4rem, 7vw, 3.4rem);
      font-weight: 900;
      color: #111;
      text-transform: uppercase;
      letter-spacing: .02em;
    }
    .bsr-sep {
      font-size: clamp(1rem, 4.5vw, 2.2rem);
      color: #555; font-weight: 900;
    }

    /* ══════════════════════
       ORANGE BAND  —  11%
       Phone number HUGE
    ══════════════════════ */
    .orange-band {
      flex: 0 0 11%;
      background: #F26522;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .num {
      font-size: clamp(2rem, 10.5vw, 5rem);
      font-weight: 900; color: #fff;
      letter-spacing: .03em; white-space: nowrap;
    }

    /* ══════════════════════
       DARK FOOTER  —  7%
       Hours + address
    ══════════════════════ */
    .footer {
      flex: 0 0 7%;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8%;
      padding: 1% 4%;
    }
    .f-hours {
      font-family: Arial, sans-serif; font-weight: 800;
      font-size: clamp(.5rem, 2.4vw, 1rem);
      color: #fff; text-transform: uppercase;
      letter-spacing: .07em; text-align: center;
      white-space: nowrap;
    }
    .f-hours b { color: #F26522; font-weight: inherit; }
    .f-addr {
      font-family: Arial, sans-serif; font-weight: 600;
      font-size: clamp(.44rem, 2vw, .84rem);
      color: rgba(255,255,255,.5);
      text-transform: uppercase; letter-spacing: .06em;
    }
  </style>
</head>
<body>
<div class="poster">

  <!-- PINK SECTION -->
  <div class="pink">

    <!-- Logo top-left on pink — like old sign -->
    <div class="logo-area">
      <img src="logo.svg" alt="Phone ElectriK" />
      <div class="logo-name">
        <span class="ln-phone">Phone</span>
        <span class="ln-electrik">ElectriK</span>
      </div>
    </div>

    <!-- Tagline dark text on pink — like old sign -->
    <div class="tag">Cell Phone + Tablet Repair and Accessories</div>

    <!-- Two phones filling the pink area -->
    <div class="phones">
      <div class="phone-col left">
        <img src="IMG_0096.jpeg" alt="iPhone 17 Pro Max" />
      </div>
      <div class="phone-col right">
        <img src="IMG_0097.jpeg" alt="Samsung Galaxy S26" />
      </div>
    </div>

  </div>

  <!-- BUY SELL REPAIR -->
  <div class="white-band">
    <span class="bsr">Buy</span>
    <span class="bsr-sep">·</span>
    <span class="bsr">Sell</span>
    <span class="bsr-sep">·</span>
    <span class="bsr">Repair</span>
  </div>

  <!-- PHONE NUMBER -->
  <div class="orange-band">
    <div class="num">(323) 348-6756</div>
  </div>

  <!-- HOURS + ADDRESS -->
  <div class="footer">
    <div class="f-hours"><b>Mon–Sat</b> 9AM–8PM &nbsp;·&nbsp; <b>Sun</b> 10AM–6PM &nbsp;·&nbsp; Walk-Ins Welcome</div>
    <div class="f-addr">3025 Artesia Blvd STE 101 · Torrance, CA 90504</div>
  </div>

</div>
</body>
</html>
