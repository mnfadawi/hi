<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phone ElectriK — Store Poster</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #111;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Arial Black', Arial, sans-serif;
    }

    /* 9:16 portrait */
    .poster {
      width:  min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* ══════════════════════════════════════════════════════
       TOP PINK SECTION  ~60%
       — matches the old sign: pink bg, logo top-left, tagline, phones
    ══════════════════════════════════════════════════════ */
    .sec-top {
      flex: 0 0 60%;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      /* PINK background like the old sign */
      background: #F2A7BF;
    }

    /* chevron/arrow pattern in background like old sign */
    .sec-top::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        repeating-linear-gradient(
          -55deg,
          rgba(180,80,110,.12) 0px, rgba(180,80,110,.12) 18px,
          transparent 18px, transparent 42px
        );
      z-index: 0;
      pointer-events: none;
    }

    /* LOGO top-left — large, like old sign */
    .logo-topleft {
      position: absolute;
      top: 4%; left: 4%;
      z-index: 2;
      display: flex; align-items: center; gap: 6%;
    }
    .logo-topleft img {
      height: clamp(50px, 10%, 90px);
      width: auto;
      /* tint logo to match old sign pink/magenta style */
      filter: brightness(0) saturate(100%) invert(35%) sepia(60%) saturate(800%) hue-rotate(300deg) brightness(90%);
    }
    .logo-words {
      display: flex; flex-direction: column; line-height: 1;
    }
    .lw-ph {
      font-size: clamp(.4rem, 1.8vw, .7rem);
      letter-spacing: .28em; color: rgba(100,20,50,.55);
      font-weight: 700; text-transform: uppercase;
    }
    .lw-el {
      font-size: clamp(1rem, 5vw, 2.2rem);
      font-weight: 900; text-transform: uppercase;
      color: #C0305A; letter-spacing: .05em;
      text-shadow: 1px 1px 0 rgba(255,255,255,.3);
      white-space: nowrap;
    }

    /* TAGLINE — dark text like old sign */
    .tagline {
      position: absolute;
      top: 18%; left: 0; right: 0;
      z-index: 2;
      text-align: center;
      font-family: Arial, sans-serif; font-weight: 800;
      font-size: clamp(.42rem, 2vw, .82rem);
      letter-spacing: .18em; text-transform: uppercase;
      color: #1a0810;
    }

    /* PHONES container — fills the pink area below tagline */
    .phones-wrap {
      position: absolute;
      top: 26%; left: 0; right: 0; bottom: 0;
      z-index: 3;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 2%;
      padding: 0 2% 0;
    }

    .ph {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      position: relative;
    }
    .ph img {
      max-height: 96%;
      max-width: 92%;
      object-fit: contain;
      position: relative; z-index: 2;
      display: block;
    }
    .ph-l img {
      filter:
        drop-shadow(0 0 20px rgba(242,101,34,.6))
        drop-shadow(4px 12px 30px rgba(0,0,0,.5));
    }
    .ph-r img {
      filter:
        drop-shadow(0 0 16px rgba(100,160,255,.35))
        drop-shadow(-4px 12px 30px rgba(0,0,0,.45));
    }

    /* ══════════════════════════════════════════════════════
       WHITE BUY · SELL · REPAIR  ~14%
    ══════════════════════════════════════════════════════ */
    .sec-bsr {
      flex: 0 0 14%;
      background: #ffffff;
      border-top: 5px solid #222;
      border-bottom: 5px solid #222;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3%;
      padding: 0 4%;
    }
    .bsr-w {
      font-size: clamp(1.3rem, 6.5vw, 3.2rem);
      font-weight: 900;
      color: #111;
      text-transform: uppercase;
      letter-spacing: .02em;
      white-space: nowrap;
    }
    .bsr-d {
      font-size: clamp(.9rem, 4vw, 1.9rem);
      color: #111; font-weight: 900; flex-shrink: 0;
    }

    /* ══════════════════════════════════════════════════════
       ORANGE NUMBER BAND  ~15%  — like the pink strip on old sign
    ══════════════════════════════════════════════════════ */
    .sec-num {
      flex: 0 0 15%;
      background: #F26522;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4%;
    }
    .big-num {
      font-size: clamp(2.2rem, 11vw, 5.2rem);
      font-weight: 900;
      color: #fff;
      letter-spacing: .03em;
      white-space: nowrap;
      text-shadow: 0 3px 14px rgba(0,0,0,.2);
    }

    /* ══════════════════════════════════════════════════════
       HOURS + ADDRESS  ~11%
    ══════════════════════════════════════════════════════ */
    .sec-info {
      flex: 0 0 11%;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10%;
      padding: 1% 5%;
      border-top: 3px solid #F26522;
    }
    .hrs {
      font-family: Arial, sans-serif; font-weight: 800;
      font-size: clamp(.55rem, 2.6vw, 1.08rem);
      color: #fff;
      text-transform: uppercase; letter-spacing: .07em;
      text-align: center; white-space: nowrap;
    }
    .hrs b { color: #F26522; font-weight: inherit; }
    .adr {
      font-family: Arial, sans-serif; font-weight: 600;
      font-size: clamp(.46rem, 2.1vw, .88rem);
      color: rgba(255,255,255,.5);
      text-transform: uppercase; letter-spacing: .06em;
      text-align: center;
    }
  </style>
</head>
<body>
<div class="poster">

  <!-- TOP PINK SECTION -->
  <div class="sec-top">

    <!-- Logo top-left like old sign -->
    <div class="logo-topleft">
      <img src="logo.svg" alt="Phone ElectriK" />
      <div class="logo-words">
        <span class="lw-ph">Phone</span>
        <span class="lw-el">ElectriK</span>
      </div>
    </div>

    <!-- Tagline -->
    <div class="tagline">Cell Phone + Tablet Repair and Accessories</div>

    <!-- Two phones -->
    <div class="phones-wrap">
      <div class="ph ph-l">
        <img src="IMG_0096.jpeg" alt="iPhone 17 Pro Max" />
      </div>
      <div class="ph ph-r">
        <img src="IMG_0097.jpeg" alt="Samsung Galaxy S26" />
      </div>
    </div>

  </div>

  <!-- BUY · SELL · REPAIR -->
  <div class="sec-bsr">
    <span class="bsr-w">Buy</span>
    <span class="bsr-d">&nbsp;·&nbsp;</span>
    <span class="bsr-w">Sell</span>
    <span class="bsr-d">&nbsp;·&nbsp;</span>
    <span class="bsr-w">Repair</span>
  </div>

  <!-- PHONE NUMBER -->
  <div class="sec-num">
    <div class="big-num">(323) 348-6756</div>
  </div>

  <!-- HOURS + ADDRESS -->
  <div class="sec-info">
    <div class="hrs"><b>Mon–Sat</b> 9AM–8PM &nbsp;·&nbsp; <b>Sun</b> 10AM–6PM &nbsp;·&nbsp; Walk-Ins Welcome</div>
    <div class="adr">3025 Artesia Blvd STE 101 &nbsp;·&nbsp; Torrance, CA 90504</div>
  </div>

</div>
</body>
</html>
