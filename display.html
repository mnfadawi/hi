<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phone ElectriK — Store Poster</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #222;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Arial Black', Arial, sans-serif;
    }

    .poster {
      width:  min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ══════════════════════════════════════
       PINK SECTION  —  68%
       Phones cover it fully, logo+tag on top
    ══════════════════════════════════════ */
    .pink {
      flex: 0 0 68%;
      position: relative;
      background: #F2A8C0;
      overflow: hidden;
    }

    /* subtle chevron pattern */
    .pink::before {
      content: '';
      position: absolute; inset: 0; z-index: 1;
      background-image: url("data:image/svg+xml,%3Csvg width='50' height='30' viewBox='0 0 50 30' xmlns='http://www.w3.org/2000/svg'%3E%3Cpolyline points='0,15 12,0 25,15 37,0 50,15' fill='none' stroke='rgba(160,60,90,0.12)' stroke-width='2'/%3E%3Cpolyline points='0,30 12,15 25,30 37,15 50,30' fill='none' stroke='rgba(160,60,90,0.12)' stroke-width='2'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    /* Phones fill the ENTIRE pink area — no gaps, start from top */
    .phones {
      position: absolute;
      inset: 0;           /* ← top/left/right/bottom all = 0 */
      z-index: 2;
      display: flex;
      align-items: flex-end;
    }
    .ph {
      flex: 1;
      height: 100%;
      overflow: hidden;
    }
    .ph img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .ph.left  img { object-position: left center; }
    .ph.right img { object-position: right center; }

    /* Logo + tagline overlaid ON TOP of phones */
    .overlay-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 4;
      /* dark gradient so text is readable over phones */
      background: linear-gradient(180deg,
        rgba(242,168,192,.92) 0%,
        rgba(242,168,192,.75) 40%,
        transparent 100%);
      padding: 3% 4% 8%;
      display: flex;
      flex-direction: column;
      gap: 5%;
    }

    .logo-row {
      display: flex; align-items: center; gap: 4%;
    }
    .logo-row img {
      height: clamp(48px, 10%, 88px);
      width: auto;
      filter: brightness(0) saturate(100%)
              invert(22%) sepia(70%) saturate(700%)
              hue-rotate(295deg) brightness(80%);
    }
    .brand-txt { display: flex; flex-direction: column; line-height: 1; }
    .bt-ph {
      font-size: clamp(.42rem, 1.8vw, .72rem);
      letter-spacing: .3em; color: rgba(100,15,45,.55);
      font-weight: 700; text-transform: uppercase;
    }
    .bt-el {
      font-size: clamp(1.2rem, 5.5vw, 2.6rem);
      font-weight: 900; text-transform: uppercase;
      color: #9A1C42; letter-spacing: .05em; white-space: nowrap;
    }

    .tagline {
      font-family: Arial, sans-serif; font-weight: 800;
      font-size: clamp(.45rem, 2.1vw, .86rem);
      letter-spacing: .15em; text-transform: uppercase;
      color: #1a0810;
    }

    /* ══════════════════════════════════════
       WHITE BAND  —  14%
    ══════════════════════════════════════ */
    .white-band {
      flex: 0 0 14%;
      background: #fff;
      border-top: 4px solid #111;
      border-bottom: 4px solid #111;
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      padding: 0 3%;
    }
    .bsr {
      font-size: clamp(1.5rem, 7.5vw, 3.6rem);
      font-weight: 900; color: #111;
      text-transform: uppercase; letter-spacing: .01em;
    }
    .dot { font-size: clamp(.9rem, 4vw, 1.8rem); color: #888; }

    /* ══════════════════════════════════════
       ORANGE BAND  —  11%
    ══════════════════════════════════════ */
    .orange-band {
      flex: 0 0 11%;
      background: #F26522;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .big-num {
      font-size: clamp(2.2rem, 11vw, 5.2rem);
      font-weight: 900; color: #fff;
      letter-spacing: .03em; white-space: nowrap;
    }

    /* ══════════════════════════════════════
       DARK FOOTER  —  7%
    ══════════════════════════════════════ */
    .footer {
      flex: 0 0 7%;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8%; padding: 1% 4%;
    }
    .f-hrs {
      font-family: Arial, sans-serif; font-weight: 800;
      font-size: clamp(.52rem, 2.5vw, 1.02rem);
      color: #fff; text-transform: uppercase;
      letter-spacing: .07em; text-align: center; white-space: nowrap;
    }
    .f-hrs b { color: #F26522; font-weight: inherit; }
    .f-adr {
      font-family: Arial, sans-serif; font-weight: 600;
      font-size: clamp(.44rem, 2vw, .84rem);
      color: rgba(255,255,255,.5);
      text-transform: uppercase; letter-spacing: .06em;
    }
  </style>
</head>
<body>
<div class="poster">

  <!-- PINK + PHONES + OVERLAY -->
  <div class="pink">

    <!-- Phones cover entire pink area -->
    <div class="phones">
      <div class="ph left">
        <img src="IMG_0096.jpeg" alt="iPhone 17 Pro Max" />
      </div>
      <div class="ph right">
        <img src="IMG_0097.jpeg" alt="Samsung Galaxy S26" />
      </div>
    </div>

    <!-- Logo + tagline overlaid on top of phones -->
    <div class="overlay-top">
      <div class="logo-row">
        <img src="logo.svg" alt="Phone ElectriK" />
        <div class="brand-txt">
          <span class="bt-ph">Phone</span>
          <span class="bt-el">ElectriK</span>
        </div>
      </div>
      <div class="tagline">Cell Phone + Tablet Repair and Accessories</div>
    </div>

  </div>

  <!-- BUY SELL REPAIR -->
  <div class="white-band">
    <span class="bsr">Buy</span>
    <span class="dot">·</span>
    <span class="bsr">Sell</span>
    <span class="dot">·</span>
    <span class="bsr">Repair</span>
  </div>

  <!-- NUMBER -->
  <div class="orange-band">
    <div class="big-num">(323) 348-6756</div>
  </div>

  <!-- HOURS + ADDRESS -->
  <div class="footer">
    <div class="f-hrs"><b>Mon–Sat</b> 9AM–8PM &nbsp;·&nbsp; <b>Sun</b> 10AM–6PM &nbsp;·&nbsp; Walk-Ins Welcome</div>
    <div class="f-adr">3025 Artesia Blvd STE 101 · Torrance, CA 90504</div>
  </div>

</div>
</body>
</html>
