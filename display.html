<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phone ElectriK — Store Poster</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #111;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Arial Black', Arial, sans-serif;
    }

    /* 9:16 portrait */
    .poster {
      width:  min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* ══════════════════════════════════════════════════════
       SECTION 1 — Brand header  ~16%
    ══════════════════════════════════════════════════════ */
    .sec-brand {
      flex: 0 0 16%;
      background: #0a0a0a;
      border-bottom: 4px solid #F26522;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6%;
      padding: 2% 6%;
      position: relative;
      overflow: hidden;
      box-shadow: 0 5px 40px rgba(242,101,34,.5);
      z-index: 2;
    }
    .sec-brand::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 70%, rgba(242,101,34,.15) 0%, transparent 60%);
    }
    .logo-row {
      display: flex; align-items: center;
      justify-content: center; gap: 4%;
      position: relative; z-index: 1;
    }
    .logo-row img {
      height: clamp(38px,7%,72px); width: auto;
      animation: logoPulse 3s ease-in-out infinite;
    }
    .brand-words { display: flex; flex-direction: column; line-height: 1; }
    .bw-sm {
      font-size: clamp(.44rem,1.9vw,.76rem);
      letter-spacing: .32em; color: rgba(255,255,255,.35);
      font-weight: 700; text-transform: uppercase;
    }
    .bw-lg {
      font-size: clamp(1.6rem,7.5vw,3.4rem);
      font-weight: 900; text-transform: uppercase;
      color: #F26522; letter-spacing: .05em;
      white-space: nowrap;
      animation: glowPulse 3s ease-in-out infinite;
    }
    .tagline {
      position: relative; z-index: 1;
      font-family: Arial, sans-serif; font-weight: 700;
      font-size: clamp(.36rem,1.65vw,.66rem);
      letter-spacing: .22em; text-transform: uppercase;
      color: rgba(255,255,255,.4); text-align: center;
    }

    /* ══════════════════════════════════════════════════════
       SECTION 2 — Phone hero  ~44%
       Warm gradient background + big logo watermark + phone
    ══════════════════════════════════════════════════════ */
    .sec-phone {
      flex: 0 0 44%;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      /* warm gradient like the old sign */
      background:
        radial-gradient(ellipse at 50% 30%, rgba(255,120,20,.35) 0%, transparent 55%),
        radial-gradient(ellipse at 20% 80%, rgba(242,101,34,.2) 0%, transparent 45%),
        radial-gradient(ellipse at 80% 70%, rgba(255,80,10,.15) 0%, transparent 45%),
        linear-gradient(160deg, #1a0800 0%, #0d0400 50%, #180600 100%);
    }

    /* big PE logo watermark in background — like the old sign */
    .watermark {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 85%; height: auto;
      opacity: .07;
      z-index: 0;
      pointer-events: none;
      filter: invert(1) sepia(1) saturate(5) hue-rotate(5deg);
    }

    /* diagonal chevron pattern like old sign */
    .sec-phone::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        repeating-linear-gradient(
          -45deg,
          rgba(242,101,34,.04) 0px,
          rgba(242,101,34,.04) 2px,
          transparent 2px,
          transparent 28px
        );
      z-index: 1;
    }

    .phone-hero {
      position: relative; z-index: 3;
      width: 86%;
      max-height: 100%;
      object-fit: contain;
      object-position: center bottom;
      display: block;
      filter:
        drop-shadow(0 0 36px rgba(242,101,34,.65))
        drop-shadow(0 -4px 60px rgba(242,101,34,.3))
        drop-shadow(0 20px 50px rgba(0,0,0,.85));
      animation: phoneFloat 6s ease-in-out infinite;
    }

    /* ══════════════════════════════════════════════════════
       SECTION 3 — BUY · SELL · REPAIR  ~13%
    ══════════════════════════════════════════════════════ */
    .sec-bsr {
      flex: 0 0 13%;
      background: #ffffff;
      border-top: 5px solid #F26522;
      border-bottom: 5px solid #F26522;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3%;
      padding: 0 4%;
      z-index: 2;
    }
    .bsr-word {
      font-size: clamp(1.2rem,6vw,2.9rem);
      font-weight: 900;
      color: #111;
      text-transform: uppercase;
      letter-spacing: .02em;
      white-space: nowrap;
    }
    .bsr-sep {
      color: #F26522;
      font-size: clamp(1rem,4.5vw,2.2rem);
      font-weight: 900;
      flex-shrink: 0;
    }

    /* ══════════════════════════════════════════════════════
       SECTION 4 — Phone number HUGE  ~15%
    ══════════════════════════════════════════════════════ */
    .sec-num {
      flex: 0 0 15%;
      background: #F26522;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    .big-num {
      font-size: clamp(2.2rem,11vw,5.4rem);
      font-weight: 900;
      color: #fff;
      letter-spacing: .03em;
      white-space: nowrap;
      text-shadow: 0 3px 20px rgba(0,0,0,.25);
    }

    /* ══════════════════════════════════════════════════════
       SECTION 5 — Hours + address  ~12%
    ══════════════════════════════════════════════════════ */
    .sec-info {
      flex: 0 0 12%;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 9%;
      padding: 1.5% 5%;
      z-index: 2;
    }
    .hours-line {
      font-family: Arial, sans-serif; font-weight: 800;
      font-size: clamp(.58rem,2.7vw,1.15rem);
      color: #fff;
      text-transform: uppercase; letter-spacing: .07em;
      text-align: center; white-space: nowrap;
    }
    .hours-line b { color: #F26522; font-weight: inherit; }
    .addr-line {
      font-family: Arial, sans-serif; font-weight: 600;
      font-size: clamp(.5rem,2.3vw,.95rem);
      color: rgba(255,255,255,.52);
      text-transform: uppercase; letter-spacing: .06em;
      text-align: center;
    }

    /* ── ANIMATIONS ──────────────────────────────────────── */
    @keyframes glowPulse {
      0%,100% { text-shadow: 0 0 8px rgba(242,101,34,1), 0 0 22px rgba(242,101,34,.6); }
      50%      { text-shadow: 0 0 16px #F26522, 0 0 40px rgba(242,101,34,.9), 0 0 90px rgba(242,101,34,.4); }
    }
    @keyframes logoPulse {
      0%,100% { filter: drop-shadow(0 0 10px rgba(242,101,34,.7)); }
      50%      { filter: drop-shadow(0 0 22px rgba(242,101,34,1)) drop-shadow(0 0 50px rgba(242,101,34,.55)); }
    }
    @keyframes phoneFloat {
      0%,100% { transform: translateY(0) rotate(-.5deg); }
      50%      { transform: translateY(-3%) rotate(.3deg); }
    }
  </style>
</head>
<body>
<div class="poster">

  <!-- 1. BRAND -->
  <div class="sec-brand">
    <div class="logo-row">
      <img src="logo.svg" alt="Phone ElectriK" />
      <div class="brand-words">
        <span class="bw-sm">Phone</span>
        <span class="bw-lg">ElectriK</span>
      </div>
    </div>
    <div class="tagline">Cell Phone + Tablet Repair and Accessories</div>
  </div>

  <!-- 2. PHONE HERO -->
  <div class="sec-phone">
    <!-- big logo watermark in background -->
    <img src="logo.svg" class="watermark" alt="" aria-hidden="true" />
    <!-- hero phone -->
    <img src="IMG_0096.jpeg" class="phone-hero" alt="iPhone 17 Pro Max" />
  </div>

  <!-- 3. BUY · SELL · REPAIR -->
  <div class="sec-bsr">
    <span class="bsr-word">Buy</span>
    <span class="bsr-sep">&#9679;</span>
    <span class="bsr-word">Sell</span>
    <span class="bsr-sep">&#9679;</span>
    <span class="bsr-word">Repair</span>
  </div>

  <!-- 4. PHONE NUMBER -->
  <div class="sec-num">
    <div class="big-num">(323) 348-6756</div>
  </div>

  <!-- 5. HOURS + ADDRESS -->
  <div class="sec-info">
    <div class="hours-line">
      <b>Mon–Sat</b> 9AM–8PM &nbsp;·&nbsp; <b>Sun</b> 10AM–6PM &nbsp;·&nbsp; Walk-Ins Welcome
    </div>
    <div class="addr-line">3025 Artesia Blvd STE 101 &nbsp;·&nbsp; Torrance, CA 90504</div>
  </div>

</div>
</body>
</html>
