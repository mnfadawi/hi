<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phone ElectriK — Store Poster</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #0d0d0d;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Arial Black', Arial, sans-serif;
    }

    .poster {
      width:  min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #050505;
      position: relative;
    }

    /* ────────────────────────────────────────────────────
       TOP BRAND  —  28% height
    ──────────────────────────────────────────────────── */
    .brand-bar {
      flex: 0 0 28%;
      background: #050505;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6%;
      padding: 3% 8%;
      position: relative;
      border-bottom: 3px solid #F26522;
      box-shadow: 0 6px 50px rgba(242,101,34,.45);
      overflow: hidden;
    }
    /* warm radial behind logo */
    .brand-bar::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse at 50% 60%, rgba(242,101,34,.16) 0%, transparent 65%);
      pointer-events: none;
    }

    .logo-row {
      display: flex; align-items: center;
      justify-content: center; gap: 5%;
      position: relative; z-index: 1;
    }
    .logo-row img {
      height: clamp(52px, 9%, 100px); width: auto;
      animation: logoPulse 3s ease-in-out infinite;
    }
    .brand-words {
      display: flex; flex-direction: column;
      line-height: 1; gap: 6%;
    }
    .bw-phone {
      font-size: clamp(.52rem, 2.4vw, 1rem);
      letter-spacing: .34em; color: rgba(255,255,255,.35);
      font-weight: 700; text-transform: uppercase;
    }
    .bw-electrik {
      font-size: clamp(1.8rem, 9vw, 4.2rem);
      font-weight: 900; text-transform: uppercase;
      color: #F26522; letter-spacing: .05em;
      white-space: nowrap;
      animation: glowPulse 3s ease-in-out infinite;
    }

    .tagline {
      font-family: Arial, sans-serif; font-weight: 700;
      font-size: clamp(.42rem, 1.9vw, .78rem);
      letter-spacing: .22em; text-transform: uppercase;
      color: rgba(255,255,255,.4);
      text-align: center;
      position: relative; z-index: 1;
      border-top: 1px solid rgba(242,101,34,.25);
      padding-top: 5%; width: 100%;
    }
    .tagline b { color: #F26522; font-weight: inherit; }

    /* ────────────────────────────────────────────────────
       PHONES  —  fills remaining space
    ──────────────────────────────────────────────────── */
    .phones-section {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    .half {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      position: relative;
      overflow: hidden;
      padding-bottom: 0;
    }
    .half-l {
      background:
        radial-gradient(ellipse at 58% 50%, rgba(242,101,34,.22) 0%, transparent 58%),
        #050505;
    }
    .half-r {
      background:
        radial-gradient(ellipse at 42% 50%, rgba(130,180,255,.12) 0%, transparent 58%),
        #050505;
    }

    /* glow discs */
    .half-l::before {
      content: '';
      position: absolute; bottom: 12%; left: 50%;
      transform: translateX(-50%);
      width: 100%; padding-top: 80%;
      background: radial-gradient(circle, rgba(242,101,34,.28) 0%, transparent 65%);
      border-radius: 50%;
      animation: breatheO 4s ease-in-out infinite;
    }
    .half-r::before {
      content: '';
      position: absolute; bottom: 12%; left: 50%;
      transform: translateX(-50%);
      width: 100%; padding-top: 80%;
      background: radial-gradient(circle, rgba(140,190,255,.15) 0%, transparent 65%);
      border-radius: 50%;
      animation: breatheW 4.5s 1.2s ease-in-out infinite;
    }

    .phone-img {
      position: relative; z-index: 2;
      width: 88%;
      max-height: 87%;
      object-fit: contain;
      display: block;
    }
    .half-l .phone-img {
      filter:
        drop-shadow(0 0 30px rgba(242,101,34,.6))
        drop-shadow(0 24px 60px rgba(0,0,0,.85));
      animation: floatL 6s ease-in-out infinite;
    }
    .half-r .phone-img {
      filter:
        drop-shadow(0 0 22px rgba(160,210,255,.4))
        drop-shadow(0 24px 60px rgba(0,0,0,.85));
      animation: floatR 6s 1.2s ease-in-out infinite;
    }

    /* name labels */
    .phone-name {
      position: relative; z-index: 2;
      font-size: clamp(.44rem, 1.9vw, .76rem);
      font-weight: 800; text-transform: uppercase;
      letter-spacing: .1em; text-align: center;
      padding: 3% 4% 4%;
      line-height: 1.35;
    }
    .half-l .phone-name { color: #F26522; }
    .half-r .phone-name { color: rgba(180,215,255,.72); }

    /* center divider + bolt */
    .divider {
      position: absolute; left: 50%; top: 4%; bottom: 4%;
      transform: translateX(-50%);
      width: 1.5px;
      background: linear-gradient(180deg,
        transparent 0%,
        rgba(242,101,34,.55) 18%,
        rgba(242,101,34,.55) 82%,
        transparent 100%);
      box-shadow: 0 0 14px rgba(242,101,34,.35);
      z-index: 6;
      display: flex; align-items: center; justify-content: center;
    }
    .bolt {
      background: #050505;
      color: #F26522;
      font-size: clamp(1rem, 4vw, 1.8rem);
      padding: 5% 0; line-height: 1;
      filter: drop-shadow(0 0 10px rgba(242,101,34,1));
      animation: boltPulse 2s ease-in-out infinite;
    }

    /* ────────────────────────────────────────────────────
       INFO BAR  —  12% height
    ──────────────────────────────────────────────────── */
    .info-bar {
      flex: 0 0 12%;
      background: #050505;
      border-top: 3px solid #F26522;
      box-shadow: 0 -6px 50px rgba(242,101,34,.35);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 4%; padding: 1% 6%;
    }
    .info-num {
      font-size: clamp(1.2rem, 6vw, 2.8rem);
      font-weight: 900; color: #fff; letter-spacing: .04em;
    }
    .info-num span { color: #F26522; }
    .info-hours {
      font-family: Arial, sans-serif; font-weight: 700;
      font-size: clamp(.36rem, 1.6vw, .64rem);
      color: rgba(255,255,255,.5); text-transform: uppercase;
      letter-spacing: .08em; text-align: center;
    }
    .info-hours b { color: #F26522; font-weight: inherit; }
    .info-addr {
      font-family: Arial, sans-serif; font-weight: 500;
      font-size: clamp(.3rem, 1.3vw, .52rem);
      color: rgba(255,255,255,.25); text-transform: uppercase;
      letter-spacing: .07em; text-align: center;
    }

    /* ── ANIMATIONS ──────────────────────────────────────── */
    @keyframes glowPulse {
      0%,100% { text-shadow: 0 0 10px rgba(242,101,34,1), 0 0 26px rgba(242,101,34,.65), 0 0 60px rgba(242,101,34,.3); }
      50%      { text-shadow: 0 0 16px #F26522, 0 0 40px rgba(242,101,34,.9), 0 0 90px rgba(242,101,34,.5); }
    }
    @keyframes logoPulse {
      0%,100% { filter: drop-shadow(0 0 12px rgba(242,101,34,.7)) drop-shadow(0 0 30px rgba(242,101,34,.3)); }
      50%      { filter: drop-shadow(0 0 22px rgba(242,101,34,1)) drop-shadow(0 0 55px rgba(242,101,34,.6)); }
    }
    @keyframes boltPulse {
      0%,100% { opacity:.8;  filter: drop-shadow(0 0 6px rgba(242,101,34,.8)); }
      50%      { opacity:1;   filter: drop-shadow(0 0 16px rgba(242,101,34,1)); }
    }
    @keyframes floatL {
      0%,100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-3%) rotate(.4deg); }
    }
    @keyframes floatR {
      0%,100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-2.5%) rotate(-.4deg); }
    }
    @keyframes breatheO {
      0%,100% { opacity:.55; transform: translateX(-50%) scale(1); }
      50%      { opacity:1;   transform: translateX(-50%) scale(1.12); }
    }
    @keyframes breatheW {
      0%,100% { opacity:.35; transform: translateX(-50%) scale(1); }
      50%      { opacity:.75; transform: translateX(-50%) scale(1.08); }
    }
  </style>
</head>
<body>
<div class="poster">

  <!-- BRAND -->
  <div class="brand-bar">
    <div class="logo-row">
      <img src="logo.svg" alt="Phone ElectriK" />
      <div class="brand-words">
        <span class="bw-phone">Phone</span>
        <span class="bw-electrik">ElectriK</span>
      </div>
    </div>
    <div class="tagline">
      Cell Phone <b>+</b> Tablet Repair and Accessories
    </div>
  </div>

  <!-- PHONES -->
  <div class="phones-section">

    <div class="half half-l">
      <img src="IMG_0096.jpeg" class="phone-img" alt="iPhone 17 Pro Max" />
      <div class="phone-name">iPhone 17<br>Pro Max</div>
    </div>

    <div class="divider"><span class="bolt">&#9889;</span></div>

    <div class="half half-r">
      <img src="IMG_0097.jpeg" class="phone-img" alt="Samsung Galaxy S26" />
      <div class="phone-name">Samsung<br>Galaxy S26</div>
    </div>

  </div>

  <!-- INFO -->
  <div class="info-bar">
    <div class="info-num"><span>(323)</span>&nbsp;348-6756</div>
    <div class="info-hours">
      <b>Mon–Sat</b> 9AM–8PM &nbsp;·&nbsp;
      <b>Sun</b> 10AM–6PM &nbsp;·&nbsp; Walk-Ins Welcome
    </div>
    <div class="info-addr">3025 Artesia Blvd STE 101 · Torrance, CA 90504</div>
  </div>

</div>
</body>
</html>
