<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phone ElectriK — Store Poster</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #111;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Arial Black', Arial, sans-serif;
    }

    /* ── 9:16 portrait ─────────────────────────────────── */
    .poster {
      width:  min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #050505;
    }

    /* ══════════════════════════════════════════════════════
       TOP  —  brand header  ~18%
    ══════════════════════════════════════════════════════ */
    .top {
      flex: 0 0 18%;
      background: #050505;
      border-bottom: 3px solid #F26522;
      box-shadow: 0 4px 40px rgba(242,101,34,.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7%;
      padding: 2% 6%;
      position: relative;
      overflow: hidden;
    }
    .top::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 60%, rgba(242,101,34,.13) 0%, transparent 65%);
    }
    .logo-row {
      display: flex; align-items: center;
      justify-content: center; gap: 4%;
      position: relative; z-index: 1;
    }
    .logo-row img {
      height: clamp(40px, 8%, 80px); width: auto;
      animation: logoPulse 3s ease-in-out infinite;
    }
    .brand-words { display: flex; flex-direction: column; line-height: 1; }
    .bw-top {
      font-size: clamp(.46rem, 2vw, .82rem);
      letter-spacing: .32em; color: rgba(255,255,255,.35);
      font-weight: 700; text-transform: uppercase;
    }
    .bw-main {
      font-size: clamp(1.6rem, 7.5vw, 3.6rem);
      font-weight: 900; text-transform: uppercase;
      color: #F26522; letter-spacing: .05em;
      white-space: nowrap;
      animation: glowPulse 3s ease-in-out infinite;
    }
    .tagline {
      position: relative; z-index: 1;
      font-family: Arial, sans-serif; font-weight: 700;
      font-size: clamp(.38rem, 1.7vw, .68rem);
      letter-spacing: .2em; text-transform: uppercase;
      color: rgba(255,255,255,.42); text-align: center;
    }

    /* ══════════════════════════════════════════════════════
       MIDDLE  —  two phones  ~42%
    ══════════════════════════════════════════════════════ */
    .phones {
      flex: 0 0 42%;
      display: flex;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 25% 55%, rgba(242,101,34,.25) 0%, transparent 50%),
        radial-gradient(ellipse at 75% 50%, rgba(120,180,255,.14) 0%, transparent 50%),
        #050505;
    }

    .half {
      flex: 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0 2% 2%;
      position: relative; overflow: hidden;
    }
    .half-l::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 55% 60%, rgba(242,101,34,.2) 0%, transparent 60%);
    }
    .half-r::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 45% 60%, rgba(130,185,255,.12) 0%, transparent 60%);
    }
    .ph-img {
      position: relative; z-index: 2;
      width: 86%;
      max-height: 95%;
      object-fit: contain;
      display: block;
    }
    .half-l .ph-img {
      filter: drop-shadow(0 0 28px rgba(242,101,34,.65)) drop-shadow(0 16px 40px rgba(0,0,0,.85));
      animation: floatL 6s ease-in-out infinite;
    }
    .half-r .ph-img {
      filter: drop-shadow(0 0 20px rgba(160,210,255,.4)) drop-shadow(0 16px 40px rgba(0,0,0,.85));
      animation: floatR 6s 1.2s ease-in-out infinite;
    }
    .divider {
      position: absolute; left: 50%; top: 5%; bottom: 5%;
      transform: translateX(-50%);
      width: 2px;
      background: linear-gradient(180deg, transparent, rgba(242,101,34,.5) 25%, rgba(242,101,34,.5) 75%, transparent);
      z-index: 6;
      display: flex; align-items: center; justify-content: center;
    }
    .bolt {
      background: #050505; color: #F26522;
      font-size: clamp(.9rem, 3.8vw, 1.7rem);
      padding: 8% 0; line-height: 1;
      filter: drop-shadow(0 0 10px rgba(242,101,34,1));
      animation: boltPulse 2s ease-in-out infinite;
    }

    /* ══════════════════════════════════════════════════════
       BUY · SELL · REPAIR  band  ~12%
    ══════════════════════════════════════════════════════ */
    .bsr-band {
      flex: 0 0 12%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4%;
      padding: 0 5%;
      border-top: 4px solid #F26522;
      border-bottom: 4px solid #F26522;
    }
    .bsr-word {
      font-size: clamp(1.1rem, 5.5vw, 2.8rem);
      font-weight: 900;
      text-transform: uppercase;
      color: #111;
      letter-spacing: .04em;
      white-space: nowrap;
    }
    .bsr-dot {
      font-size: clamp(.8rem, 3.5vw, 1.8rem);
      color: #F26522;
      font-weight: 900;
      flex-shrink: 0;
    }

    /* ══════════════════════════════════════════════════════
       PHONE NUMBER  —  huge  ~16%
    ══════════════════════════════════════════════════════ */
    .phone-band {
      flex: 0 0 16%;
      background: #F26522;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5%;
    }
    .phone-num {
      font-size: clamp(2rem, 10vw, 5rem);
      font-weight: 900;
      color: #fff;
      letter-spacing: .03em;
      white-space: nowrap;
      text-shadow: 0 3px 16px rgba(0,0,0,.3);
    }

    /* ══════════════════════════════════════════════════════
       HOURS + ADDRESS  —  bottom  ~12%
    ══════════════════════════════════════════════════════ */
    .bottom-info {
      flex: 0 0 12%;
      background: #050505;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8%;
      padding: 1.5% 5%;
      border-top: 3px solid #222;
    }
    .hours-text {
      font-family: Arial, sans-serif; font-weight: 800;
      font-size: clamp(.55rem, 2.6vw, 1.1rem);
      color: #fff;
      text-transform: uppercase; letter-spacing: .08em;
      text-align: center; white-space: nowrap;
    }
    .hours-text span { color: #F26522; }
    .addr-text {
      font-family: Arial, sans-serif; font-weight: 600;
      font-size: clamp(.48rem, 2.2vw, .92rem);
      color: rgba(255,255,255,.55);
      text-transform: uppercase; letter-spacing: .07em;
      text-align: center;
    }

    /* ── KEYFRAMES ──────────────────────────────────────── */
    @keyframes glowPulse {
      0%,100% { text-shadow: 0 0 8px rgba(242,101,34,1), 0 0 22px rgba(242,101,34,.6); }
      50%      { text-shadow: 0 0 14px #F26522, 0 0 36px rgba(242,101,34,.9), 0 0 80px rgba(242,101,34,.4); }
    }
    @keyframes logoPulse {
      0%,100% { filter: drop-shadow(0 0 10px rgba(242,101,34,.65)); }
      50%      { filter: drop-shadow(0 0 22px rgba(242,101,34,1)) drop-shadow(0 0 50px rgba(242,101,34,.55)); }
    }
    @keyframes boltPulse {
      0%,100% { opacity:.8; }  50% { opacity:1; }
    }
    @keyframes floatL {
      0%,100% { transform: translateY(0) rotate(-.5deg); }
      50%      { transform: translateY(-4%) rotate(.4deg); }
    }
    @keyframes floatR {
      0%,100% { transform: translateY(0) rotate(.5deg); }
      50%      { transform: translateY(-3.5%) rotate(-.3deg); }
    }
  </style>
</head>
<body>
<div class="poster">

  <!-- BRAND -->
  <div class="top">
    <div class="logo-row">
      <img src="logo.svg" alt="Phone ElectriK" />
      <div class="brand-words">
        <span class="bw-top">Phone</span>
        <span class="bw-main">ElectriK</span>
      </div>
    </div>
    <div class="tagline">Cell Phone + Tablet Repair and Accessories</div>
  </div>

  <!-- PHONES -->
  <div class="phones">
    <div class="half half-l">
      <img src="IMG_0096.jpeg" class="ph-img" alt="iPhone 17 Pro Max" />
    </div>
    <div class="divider"><span class="bolt">&#9889;</span></div>
    <div class="half half-r">
      <img src="IMG_0097.jpeg" class="ph-img" alt="Samsung Galaxy S26" />
    </div>
  </div>

  <!-- BUY · SELL · REPAIR -->
  <div class="bsr-band">
    <span class="bsr-word">Buy</span>
    <span class="bsr-dot">&#9679;</span>
    <span class="bsr-word">Sell</span>
    <span class="bsr-dot">&#9679;</span>
    <span class="bsr-word">Repair</span>
  </div>

  <!-- PHONE NUMBER BIG -->
  <div class="phone-band">
    <div class="phone-num">(323) 348-6756</div>
  </div>

  <!-- HOURS + ADDRESS -->
  <div class="bottom-info">
    <div class="hours-text">
      <span>Mon–Sat</span> 9AM–8PM &nbsp;·&nbsp; <span>Sun</span> 10AM–6PM &nbsp;·&nbsp; Walk-Ins Welcome
    </div>
    <div class="addr-text">3025 Artesia Blvd STE 101 &nbsp;·&nbsp; Torrance, CA 90504</div>
  </div>

</div>
</body>
</html>
