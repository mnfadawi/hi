<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex" />
<title>Phone ElectriK — All Our Links (TV slide)</title>
<!-- Portrait 1080x1920 slide for the TV loop, rendered by build.py.
     links-qr.svg encodes https://phoneelectrik.com/links (the same page as the
     counter stand). The list below names exactly what links.html offers:
     Instagram, TikTok, YouTube, Shop Our Products (cases, chargers &
     accessories), website, directions, call. The [data-pulse] frame glows. -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
  body{position:relative;color:#fff;font-family:Inter,"Liberation Sans",sans-serif;display:flex;flex-direction:column;justify-content:center;align-items:center;
       background:radial-gradient(ellipse 120% 55% at 50% 0%,#3a1505 0%,#000 62%)}
  .bar{position:absolute;left:0;width:1080px;height:18px;background:linear-gradient(90deg,#c94a10,#F26522,#c94a10)}
  .bar.top{top:0}.bar.bottom{bottom:0}
  .o{color:#F26522}

  h1{font-family:"Inter Display",Inter,sans-serif;font-weight:900;text-align:center;line-height:.95}
  h1 span{display:block}
  h1 .a{font-size:118px}
  h1 .b{font-size:118px}

  .qr{width:660px;height:660px;margin-top:60px;background:#fff;border-radius:34px;padding:20px;border:10px solid #F26522}
  body.lit .qr{box-shadow:0 0 90px 18px rgba(255,122,58,.8);border-color:#ff7a3a}
  .qr img{display:block;width:100%;height:100%}
  .cam{text-align:center;margin-top:28px;font-size:42px;font-weight:800}
  .url{text-align:center;margin-top:18px;font-family:"Inter Display",Inter,sans-serif;font-weight:900;font-size:76px}

  .list{width:980px;margin-top:50px;border-top:2px solid #3a3a3a;padding-top:40px;text-align:center}
  .list div{font-size:44px;font-weight:800;line-height:1.25}
  .list div + div{margin-top:16px}
  .list .dim{color:#d6d6d6;font-weight:700}
</style>
</head>
<body>
  <div class="bar top"></div>

  <h1><span class="a">ALL OUR LINKS</span><span class="b o">IN ONE SCAN</span></h1>

  <div class="qr" data-pulse><img src="links-qr.svg" alt="QR code: phoneelectrik.com/links" /></div>
  <div class="cam">📷 Point your camera here</div>
  <div class="url">phoneelectrik.com/<span class="o">links</span></div>

  <div class="list">
    <div>Instagram · TikTok · YouTube</div>
    <div><span class="o">Shop</span> cases, chargers &amp; accessories</div>
    <div class="dim">Website · Directions · Call us</div>
  </div>

  <div class="bar bottom"></div>
</body>
</html>
