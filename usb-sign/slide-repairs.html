<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex" />
<title>Phone ElectriK — What We Fix (TV slide)</title>
<!-- Portrait 1080x1920 slide for the 3-slide TV loop, rendered by build.py.
     Wording from index.html / services.html. -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
  body{position:relative;color:#fff;font-family:Inter,"Liberation Sans",sans-serif;
       background:radial-gradient(ellipse 120% 60% at 50% 0%,#3a1505 0%,#000 60%)}
  .bar{position:absolute;left:0;width:1080px;height:18px;background:linear-gradient(90deg,#c94a10,#F26522,#c94a10)}
  .bar.top{top:0}.bar.bottom{bottom:0}
  .o{color:#F26522}

  .logo{display:block;width:230px;height:190px;object-fit:contain;margin:70px auto 0}
  h1{font-family:"Inter Display",Inter,sans-serif;font-weight:900;text-align:center;line-height:.95;margin-top:40px}
  h1 .a{display:block;font-size:84px;letter-spacing:.01em}
  h1 .b{display:block;font-size:100px;letter-spacing:.01em}
  .sub{font-size:40px;font-weight:700;text-align:center;margin-top:26px;color:#ffd9c4}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:30px;width:980px;margin:60px auto 0}
  .tile{height:196px;border-radius:26px;background:linear-gradient(160deg,#1d1d1d,#111);border:2px solid #3a3a3a;
        display:flex;align-items:center;gap:22px;padding:0 26px}
  .tile svg{flex:none;width:92px;height:92px;stroke:#F26522;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .tile span{font-size:46px;font-weight:800;line-height:1.05}

  .warranty{width:980px;margin:60px auto 0;border-radius:26px;background:linear-gradient(90deg,#d8501a,#F26522);
            text-align:center;padding:30px 20px;box-shadow:0 0 60px rgba(242,101,34,.45)}
  .warranty b{display:block;font-family:"Inter Display",Inter,sans-serif;font-weight:900;font-size:66px;line-height:1}
  .warranty i{display:block;font-style:normal;font-size:34px;font-weight:700;margin-top:12px}
  .brands{font-size:30px;font-weight:600;color:#cfcfcf;text-align:center;margin-top:44px}
</style>
</head>
<body>
  <div class="bar top"></div>
  <img class="logo" src="logo.png" alt="Phone ElectriK" />

  <h1><span class="a">WE FIX MOST</span><span class="b o">MAKES &amp; MODELS</span></h1>
  <div class="sub">Most repairs done while you wait</div>

  <div class="grid">
    <div class="tile"><svg viewBox="0 0 64 64"><rect x="16" y="4" width="32" height="56" rx="6"/><path d="M22 16l10 12-6 6 12 14"/></svg><span>Screen<br>Repair</span></div>
    <div class="tile"><svg viewBox="0 0 64 64"><rect x="6" y="18" width="46" height="28" rx="5"/><path d="M52 27h6v10h-6M14 32h8M18 28v8"/></svg><span>Battery<br>Replacement</span></div>
    <div class="tile"><svg viewBox="0 0 64 64"><path d="M22 6v14M42 6v14M16 20h32v12a16 16 0 0 1-32 0zM32 48v12"/></svg><span>Charging<br>Port</span></div>
    <div class="tile"><svg viewBox="0 0 64 64"><rect x="16" y="4" width="32" height="56" rx="6"/><rect x="22" y="10" width="11" height="11" rx="3"/><path d="M30 34l8 6-6 6 8 6"/></svg><span>Back<br>Glass</span></div>
    <div class="tile"><svg viewBox="0 0 64 64"><path d="M8 20h12l5-7h14l5 7h12v34H8z"/><circle cx="32" cy="36" r="10"/></svg><span>Camera<br>Lens</span></div>
    <div class="tile"><svg viewBox="0 0 64 64"><rect x="10" y="4" width="44" height="56" rx="6"/><path d="M28 52h8"/></svg><span>iPad &amp;<br>Tablet</span></div>
    <div class="tile"><svg viewBox="0 0 64 64"><rect x="12" y="12" width="40" height="28" rx="3"/><path d="M4 48h56l-4 6H8z"/></svg><span>MacBook &amp;<br>Laptop</span></div>
    <div class="tile"><svg viewBox="0 0 64 64"><path d="M18 20h28a12 12 0 0 1 12 12v8a8 8 0 0 1-14 5l-4-5H24l-4 5a8 8 0 0 1-14-5v-8a12 12 0 0 1 12-12z"/><path d="M20 28v10M15 33h10"/><circle cx="44" cy="30" r="1.5"/><circle cx="48" cy="36" r="1.5"/></svg><span>Game<br>Consoles</span></div>
  </div>

  <div class="warranty"><b>90-DAY WARRANTY</b><i>on every repair</i></div>
  <div class="brands">iPhone · Samsung · Google Pixel · Motorola · LG · Apple Watch &amp; more</div>

  <div class="bar bottom"></div>
</body>
</html>
