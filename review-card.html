<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Review Card — Phone ElectriK</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Arial Black', Arial, sans-serif;
      background: #bbb;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }
    /* 4x6 landscape card */
    .card {
      width: 660px;
      background: #fff;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
    }
    /* top bar */
    .top {
      background: linear-gradient(135deg, #d45000, #f97316, #ffb347);
      padding: 16px 28px 14px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: relative;
      overflow: hidden;
    }
    .top::before {
      content:''; position:absolute; inset:0;
      background: repeating-linear-gradient(-45deg,transparent,transparent 12px,rgba(255,255,255,0.07) 12px,rgba(255,255,255,0.07) 24px);
    }
    .top > * { position:relative; z-index:1; }
    .logo-img { height:44px; filter:brightness(0) invert(1); }
    .top-text { flex:1; }
    .top-stars { font-size:1.8rem; letter-spacing:3px; line-height:1; margin-bottom:4px; }
    .top-headline {
      font-size:1.55rem; font-weight:900; color:#fff;
      text-transform:uppercase; line-height:1.05;
      text-shadow:0 2px 6px rgba(0,0,0,0.3);
    }
    .top-sub {
      font-size:0.72rem; color:rgba(255,255,255,0.9);
      font-family:Arial,sans-serif; margin-top:4px;
    }
    /* bridge */
    .bridge {
      background:#111; color:#f97316;
      font-size:0.65rem; font-weight:900;
      text-transform:uppercase; letter-spacing:5px;
      text-align:center; padding:7px;
    }
    /* qr row */
    .qr-row {
      display:flex; gap:0;
      flex:1;
    }
    .qr-half {
      flex:1;
      padding:14px 18px 12px;
      text-align:center;
    }
    .qr-half.g { background:#EBF3FF; border-right:2px solid #e0e0e0; border-top:4px solid #4285F4; }
    .qr-half.y { background:#FFF0F0; border-top:4px solid #D01212; }
    .badge {
      display:inline-block; font-size:0.6rem; font-weight:900;
      text-transform:uppercase; letter-spacing:1px;
      padding:3px 10px; border-radius:100px; margin-bottom:8px;
    }
    .gbadge { background:#4285F4; color:#fff; }
    .ybadge { background:#D01212; color:#fff; }
    .arrow { font-size:1.4rem; margin-bottom:6px; }
    .qr-half img { display:block; width:168px; height:168px; margin:0 auto; }
    .pname {
      font-size:1rem; font-weight:900; text-transform:uppercase;
      letter-spacing:1px; margin-top:10px;
      display:flex; align-items:center; justify-content:center; gap:6px;
    }
    .gn { color:#4285F4; } .yn { color:#D01212; }
    /* bottom */
    .bottom {
      background:#111; padding:10px 24px;
      display:flex; align-items:center; justify-content:space-between;
    }
    .bname { color:#f97316; font-size:0.85rem; font-weight:900; }
    .binfo { color:#777; font-size:0.6rem; margin-top:2px; line-height:1.4; font-family:Arial,sans-serif; }
    .bthanks { color:#fff; font-size:0.95rem; font-weight:900; }

    @media print {
      body { background:#fff; padding:0; min-height:0; }
      .card { box-shadow:none; border-radius:0; width:100%; }
    }
  </style>
</head>
