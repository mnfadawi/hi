<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Review Poster | Phone ElectriK</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .poster {
      width: 750px;
      background: #fff;
      border: 4px solid #111;
      border-radius: 18px;
      overflow: hidden;
      text-align: center;
    }

    /* Top orange band */
    .top-band {
      background: #f97316;
      padding: 22px 30px 18px;
    }

    .logo {
      height: 70px;
      width: auto;
      filter: brightness(0) invert(1);
      margin-bottom: 10px;
    }

    .stars {
      font-size: 3.2rem;
      line-height: 1;
      margin-bottom: 6px;
    }

    .headline {
      font-size: 2.2rem;
      font-weight: 900;
      color: #fff;
      line-height: 1.15;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .sub {
      font-size: 1rem;
      color: rgba(255,255,255,0.88);
      margin-top: 6px;
      font-weight: 500;
    }

    /* QR section */
    .qr-section {
      padding: 28px 30px 24px;
      background: #fff;
    }

    .scan-label {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #999;
      margin-bottom: 20px;
    }

    .qr-row {
      display: flex;
      gap: 24px;
      justify-content: center;
    }

    .qr-block {
      flex: 1;
      max-width: 290px;
      border: 3px solid #111;
      border-radius: 16px;
      padding: 18px 18px 14px;
      background: #fff;
    }

    .qr-frame {
      background: #fff;
      border-radius: 8px;
      display: inline-block;
      margin-bottom: 12px;
    }
    .qr-frame img { display: block; }

    .platform-name {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 1.3rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .platform-icon { width: 28px; height: 28px; }
    .g { color: #4285F4; }
    .y { color: #FF1A1A; }

    /* Google block accent */
    .qr-block.google-block { border-color: #4285F4; }
    .qr-block.yelp-block   { border-color: #FF1A1A; }

    /* Bottom band */
    .bottom-band {
      background: #111;
      padding: 14px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .bottom-left {
      text-align: left;
    }

    .store-name {
      font-size: 1rem;
      font-weight: 800;
      color: #f97316;
      letter-spacing: 0.5px;
    }

    .store-info {
      font-size: 0.72rem;
      color: #888;
      margin-top: 2px;
      line-height: 1.5;
    }

    .thanks {
      font-size: 1.1rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: 1px;
    }

    @media print {
      body { padding: 0; background: #fff; }
      .poster { border-radius: 0; border: none; width: 100%; }
    }
  </style>
</head>
