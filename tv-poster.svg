<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#1a0a00"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <radialGradient id="glow1" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#F26522" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#F26522" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#F26522" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#F26522" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F26522"/>
      <stop offset="100%" stop-color="#c94a10"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F26522"/>
      <stop offset="50%" stop-color="#ffaa55"/>
      <stop offset="100%" stop-color="#F26522"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <ellipse cx="540" cy="760" rx="580" ry="580" fill="url(#glow1)"/>
  <ellipse cx="540" cy="1650" rx="400" ry="400" fill="url(#glow2)"/>

  <!-- Top orange bar -->
  <rect x="0" y="0" width="1080" height="10" fill="url(#orange-grad)"/>

  <!-- Logo icon -->
  <rect x="455" y="80" width="170" height="170" rx="32" fill="url(#orange-grad)"/>
  <text x="540" y="196" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="96" fill="#fff">⚡</text>

  <!-- PHONE ELECTRIK -->
  <text x="540" y="348" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="96" font-weight="900" fill="#ffffff" letter-spacing="8">PHONE</text>
  <text x="540" y="458" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="96" font-weight="900" fill="url(#orange-grad)" letter-spacing="8">ELECTRIK</text>

  <!-- Thin divider -->
  <line x1="200" y1="500" x2="880" y2="500" stroke="rgba(242,101,34,0.25)" stroke-width="1"/>

  <!-- Cell Phone Repair & Accessories -->
  <text x="540" y="558" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="600" fill="rgba(255,255,255,0.45)" letter-spacing="3">Cell Phone · Tablet Repair &amp; Accessories</text>

  <!-- BIG WELCOME -->
  <text x="540" y="780" text-anchor="middle" font-family="Arial Black, Georgia, sans-serif" font-size="190" font-weight="900" fill="url(#text-grad)" letter-spacing="-4" opacity="0.95">Welcome</text>

  <!-- Warm message -->
  <text x="540" y="870" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="600" fill="rgba(255,255,255,0.6)">We're glad you're here.</text>
  <text x="540" y="924" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="600" fill="rgba(255,255,255,0.6)">How can we help you today?</text>

  <!-- Divider -->
  <line x1="120" y1="980" x2="960" y2="980" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Walk in badge -->
  <rect x="240" y="1020" width="600" height="80" rx="40" fill="rgba(242,101,34,0.15)" stroke="rgba(242,101,34,0.5)" stroke-width="1.5"/>
  <text x="540" y="1070" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#F26522">🚶 Walk In · No Appointment Needed</text>

  <!-- 90 day warranty badge -->
  <rect x="240" y="1120" width="600" height="80" rx="40" fill="rgba(242,101,34,0.15)" stroke="rgba(242,101,34,0.5)" stroke-width="1.5"/>
  <text x="540" y="1170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#F26522">🛡️ 90-Day Warranty on Every Repair</text>

  <!-- Divider -->
  <line x1="120" y1="1240" x2="960" y2="1240" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- CALL US label -->
  <text x="540" y="1320" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="rgba(255,255,255,0.3)" letter-spacing="12">CALL US</text>

  <!-- Phone number -->
  <text x="540" y="1430" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="100" font-weight="900" fill="#F26522" letter-spacing="2">(323) 348-6756</text>

  <!-- Divider -->
  <line x1="120" y1="1490" x2="960" y2="1490" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Hours label -->
  <text x="540" y="1570" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="rgba(255,255,255,0.3)" letter-spacing="12">HOURS</text>
  <text x="540" y="1650" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="54" font-weight="900" fill="#ffffff">Mon – Sat: 9AM – 8PM</text>
  <text x="540" y="1720" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="54" font-weight="900" fill="#ffffff">Sun: 10AM – 6PM</text>

  <!-- Website -->
  <text x="540" y="1820" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="rgba(255,255,255,0.25)" letter-spacing="2">phoneelectrik.com</text>

  <!-- Bottom orange bar -->
  <rect x="0" y="1910" width="1080" height="10" fill="url(#orange-grad)"/>
</svg>
