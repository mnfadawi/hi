<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#F26522" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <title>Google Review | Phone ElectriK</title>
  <!-- NFC stand redirect. The in-store Google NFC chip and QR code point here
       (phoneelectrik.com/g). To change where the stand sends people, edit
       REVIEW_URL below and the meta refresh; the chip never needs reprogramming. -->
  <meta http-equiv="refresh" content="0;url=https://www.google.com/search?q=Phone+ElectriK+Torrance+reviews" />
  <script>
    var REVIEW_URL = "https://www.google.com/search?q=Phone+ElectriK+Torrance+reviews";
    window.location.replace(REVIEW_URL);
  </script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:#111;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
    .logo{font-size:2.2rem;font-weight:900;color:#F26522;letter-spacing:.05em;text-transform:uppercase;margin-bottom:10px}
    p{color:rgba(255,255,255,.65);margin-bottom:26px;line-height:1.6}
    a.btn{display:inline-block;background:#4285F4;color:#fff;font-weight:800;font-size:1.05rem;padding:15px 34px;border-radius:10px;text-decoration:none}
  </style>
</head>
<body>
  <div>
    <div class="logo">Phone ElectriK</div>
    <p>Thanks for visiting! Opening Google&hellip;</p>
    <a class="btn" href="https://www.google.com/search?q=Phone+ElectriK+Torrance+reviews">Open Google</a>
  </div>
</body>
</html>
