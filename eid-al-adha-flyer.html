<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eid al-Adha 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body { background: #000; }

.flyer {
  width: 540px;
  height: 960px;
  background: #0a1a0c;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  font-family: 'Cormorant Garamond', Georgia, serif;
}

/* ─── HERO ─── */
.hero {
  flex: 0 0 540px;
  position: relative;
  overflow: hidden;
}

.hero-bg {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
  display: block;
}

.hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    180deg,
    rgba(0,0,0,0.18) 0%,
    rgba(0,0,0,0.08) 20%,
    rgba(0,0,0,0.28) 50%,
    rgba(10,26,12,0.86) 80%,
    rgba(10,26,12,1.0) 100%
  );
}

.hero-content {
  position: absolute;
  bottom: 26px;
  left: 0;
  right: 0;
  text-align: center;
  padding: 0 28px;
}

.ornament {
  display: block;
  color: #c9a227;
  font-size: 18px;
  letter-spacing: 10px;
  margin-bottom: 12px;
}

.eid-mubarak-en {
  font-family: 'Great Vibes', cursive;
  font-size: 82px;
  color: #f5e6c4;
  line-height: 0.95;
  text-shadow:
    0 0 50px rgba(201,162,39,0.45),
    0 2px 12px rgba(0,0,0,0.7);
}

.eid-mubarak-ar {
  font-family: 'Amiri', serif;
  font-size: 52px;
  color: #c9a227;
  direction: rtl;
  line-height: 1.2;
  margin-top: 4px;
}

.divider-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin: 10px 50px;
}

.div-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(to right, transparent, rgba(149,199,149,0.55));
}

.div-line-r {
  flex: 1;
  height: 1px;
  background: linear-gradient(to left, transparent, rgba(149,199,149,0.55));
}

.div-gem {
  width: 5px;
  height: 5px;
  background: #95c795;
  transform: rotate(45deg);
  flex-shrink: 0;
}

.occasion-text {
  font-size: 13.5px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #95c795;
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
}

/* ─── DUA ─── */
.dua-section {
  flex: 0 0 118px;
  background: linear-gradient(135deg, #111f15 0%, #0a1a0c 100%);
  border-top: 1px solid rgba(149,199,149,0.2);
  border-bottom: 1px solid rgba(149,199,149,0.2);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0 36px;
  gap: 7px;
  text-align: center;
}

.dua-ar {
  font-family: 'Amiri', serif;
  font-size: 26px;
  color: #c9a227;
  direction: rtl;
  line-height: 1.3;
}

.dua-en {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 14.5px;
  color: #8fba8f;
  letter-spacing: 0.6px;
}

/* ─── BOTTOM ─── */
.bottom-section {
  flex: 1;
  background: #0a1a0c;
  padding: 18px 18px 20px;
  display: flex;
  flex-direction: column;
}

.photo-label {
  text-align: center;
  font-size: 11.5px;
  letter-spacing: 3.5px;
  text-transform: uppercase;
  color: rgba(149,199,149,0.55);
  margin-bottom: 11px;
  font-family: 'Cormorant Garamond', serif;
}

.photos-row {
  display: flex;
  gap: 10px;
  height: 168px;
  margin-bottom: 13px;
}

.photo-frame {
  border-radius: 7px;
  overflow: hidden;
  border: 1px solid rgba(149,199,149,0.22);
  flex-shrink: 0;
}

.citadel-frame { width: 230px; }
.citadel-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
}

.syria-frame {
  width: 127px;
  background: #050d07;
  display: flex;
  align-items: center;
  justify-content: center;
}
.syria-frame img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  padding: 10px;
  display: block;
}

.goat-frame { width: 127px; }
.goat-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 12%;
  display: block;
}

.location-text {
  text-align: center;
  font-family: 'Amiri', serif;
  font-size: 17px;
  color: #b0ccb0;
  letter-spacing: 0.8px;
  margin-bottom: 8px;
}

.date-text {
  text-align: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: 13.5px;
  letter-spacing: 3.5px;
  text-transform: uppercase;
  color: #c9a227;
}
</style>
</head>
<body>
<div class="flyer">

  <!-- HERO: Kaaba at night in the rain -->
  <div class="hero">
    <img class="hero-bg" src="IMG_0171.jpeg" alt="">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <span class="ornament">☽ &nbsp;✦&nbsp; ☾</span>
      <div class="eid-mubarak-en">Eid Mubarak</div>
      <div class="eid-mubarak-ar">عيد مبارك</div>
      <div class="divider-row">
        <div class="div-line"></div>
        <div class="div-gem"></div>
        <div class="div-line-r"></div>
      </div>
      <div class="occasion-text">Eid al-Adha &nbsp;·&nbsp; عيد الأضحى &nbsp;·&nbsp; 2026</div>
    </div>
  </div>

  <!-- DUA -->
  <div class="dua-section">
    <div class="dua-ar">تَقَبَّلَ اللهُ مِنَّا وَمِنكُم</div>
    <div class="dua-en">May Allah accept from us and from you</div>
  </div>

  <!-- BOTTOM: Citadel · Syria · Goat -->
  <div class="bottom-section">
    <div class="photo-label">Aleppo Citadel &nbsp;·&nbsp; قلعة حلب &nbsp;·&nbsp; Syria &nbsp;·&nbsp; Qurbani</div>
    <div class="photos-row">
      <div class="photo-frame citadel-frame">
        <img src="IMG_0168.jpeg" alt="Citadel of Aleppo">
      </div>
      <div class="photo-frame syria-frame">
        <img src="IMG_0172.png" alt="Syria Independence Flag">
      </div>
      <div class="photo-frame goat-frame">
        <img src="IMG_0169.webp" alt="Qurbani">
      </div>
    </div>
    <div class="location-text">حلب، سوريا &nbsp;·&nbsp; Aleppo, Syria</div>
    <div class="date-text">Wednesday &nbsp;·&nbsp; May 27, 2026</div>
  </div>

</div>
</body>
</html>
